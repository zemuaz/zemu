<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Zemu.az - Qeydiyyat</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f5f5f5;
      padding: 20px;
    }

    .register-box {
      width: 100%;
      max-width: 420px;
      background: white;
      padding: 30px;
      border-radius: 18px;
      box-shadow: 0 5px 25px rgba(0,0,0,.1);
    }

    .logo {
      text-align: center;
      color: #ff4d00;
      font-size: 32px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    h2 {
      text-align: center;
      margin-bottom: 25px;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 15px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #ff4d00;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: #ff4d00;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:active {
      transform: scale(.98);
    }

    #message {
      text-align: center;
      margin-top: 15px;
      font-size: 14px;
    }

    .login {
      text-align: center;
      margin-top: 20px;
    }

    .login a {
      color: #ff4d00;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="register-box">

    <div class="logo">
      Zemu.az
    </div>

    <h2>Qeydiyyatdan keç</h2>

    <form id="registerForm">

      <input
        id="name"
        type="text"
        placeholder="Adınız"
        required
      >

      <input
        id="email"
        type="email"
        placeholder="E-poçt"
        required
      >

      <input
        id="password"
        type="password"
        placeholder="Şifrə"
        minlength="6"
        required
      >

      <button type="submit">
        Qeydiyyatdan keç
      </button>

    </form>

    <div id="message"></div>

    <div class="login">
      Artıq hesabınız var?
      <a href="login.html">
        Daxil olun
      </a>
    </div>

  </div>


  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>

    const SUPABASE_URL =
      "https://cpwlypwlraeudehaookn.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_BaxB73FACTL2Sht9ob0ywg_qulL8OPE";

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    document
      .getElementById("registerForm")
      .addEventListener("submit", async function(e) {

        e.preventDefault();

        const name =
          document.getElementById("name").value;

        const email =
          document.getElementById("email").value;

        const password =
          document.getElementById("password").value;

        const message =
          document.getElementById("message");


        message.textContent =
          "Qeydiyyat edilir...";


        const { data, error } =
          await supabaseClient.auth.signUp({

            email: email,

            password: password,

            options: {
              data: {
                name: name
              }
            }

          });


        if (error) {

          message.textContent =
            "Xəta: " + error.message;

          return;
        }


        message.textContent =
          "Qeydiyyat uğurla tamamlandı!";

      });

  </script>

</body>
</html>
