<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zemu.az - Qeydiyyat</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .box {
      width: 100%;
      max-width: 400px;
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 5px 20px rgba(0,0,0,.1);
    }

    .logo {
      text-align: center;
      color: #ff4d00;
      font-size: 32px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    h2 {
      text-align: center;
      margin-bottom: 25px;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 15px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 8px;
      background: #ff4d00;
      color: white;
      font-size: 16px;
      font-weight: bold;
    }

    #message {
      text-align: center;
      margin-top: 15px;
    }
  </style>
</head>

<body>

<div class="box">

  <div class="logo">Zemu.az</div>

  <h2>Qeydiyyat</h2>

  <form id="registerForm">

    <input
      id="email"
      type="email"
      placeholder="E-poçt"
      required
    >

    <input
      id="password"
      type="password"
      placeholder="Şifrə"
      minlength="6"
      required
    >

    <button type="submit">
      Qeydiyyatdan keç
    </button>

  </form>

  <div id="message"></div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const supabaseClient = supabase.createClient(
  "https://cpwlypwlraeudehaookn.supabase.co",
  "sb_publishable_BaxB73FACTL2Sht9ob0ywg_qulL8OPE"
);


document
  .getElementById("registerForm")
  .addEventListener("submit", async function(event) {

    event.preventDefault();

    const email =
      document.getElementById("email").value;

    const password =
      document.getElementById("password").value;

    const message =
      document.getElementById("message");

    message.textContent = "Gözləyin...";


    const { data, error } =
      await supabaseClient.auth.signUp({
        email: email,
        password: password
      });


    if (error) {

      message.textContent =
        "Xəta: " + error.message;

      return;
    }


    message.textContent =
      "Qeydiyyat uğurludur! E-poçtunu yoxla.";

  });

</script>

</body>
</html>
