<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Zemu.az - Giriş</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .box {
      width: 100%;
      max-width: 400px;
      background: white;
      padding: 30px;
      border-radius: 18px;
      box-shadow: 0 5px 25px rgba(0,0,0,.1);
    }

    .logo {
      text-align: center;
      color: #ff4d00;
      font-size: 32px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    h2 {
      text-align: center;
      margin-bottom: 25px;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 15px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #ff4d00;
    }

    button {
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 8px;
      background: #ff4d00;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    #message {
      text-align: center;
      margin-top: 15px;
      color: #d33;
    }

    .register {
      text-align: center;
      margin-top: 20px;
    }

    .register a {
      color: #ff4d00;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>

<body>

<div class="box">

  <div class="logo">
    Zemu.az
  </div>

  <h2>
    Hesaba daxil ol
  </h2>

  <form id="loginForm">

    <input
      id="email"
      type="email"
      placeholder="E-poçt"
      required
    >

    <input
      id="password"
      type="password"
      placeholder="Şifrə"
      required
    >

    <button type="submit">
      Daxil ol
    </button>

  </form>

  <div id="message"></div>

  <div class="register">
    Hesabınız yoxdur?
    <a href="register.html">
      Qeydiyyatdan keç
    </a>
  </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const supabaseClient = supabase.createClient(
  "https://cpwlypwlraeudehaookn.supabase.co",
  "sb_publishable_BaxB73FACTL2Sht9ob0ywg_qulL8OPE"
);


document
  .getElementById("loginForm")
  .addEventListener("submit", async function(event) {

    event.preventDefault();

    const email =
      document.getElementById("email").value;

    const password =
      document.getElementById("password").value;

    const message =
      document.getElementById("message");

    message.textContent =
      "Giriş edilir...";


    const { data, error } =
      await supabaseClient.auth.signInWithPassword({

        email: email,
        password: password

      });


    if (error) {

      message.textContent =
        "E-poçt və ya şifrə yanlışdır.";

      return;
    }


    window.location.href = "index.html";

  });

</script>

</body>
  </html>
